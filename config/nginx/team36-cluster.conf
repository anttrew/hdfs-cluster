
# NameNode
server {
    listen 9440 ssl;
    server_name 171.22.73.124;

    ssl_certificate /etc/nginx/tls/team36.crt;
    ssl_certificate_key /etc/nginx/tls/team36.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:team36SSL:1m;

    auth_basic "Team36 cluster";
    auth_basic_user_file /etc/nginx/team36.htpasswd;

    location / {
        proxy_pass http://10.36.0.11:9870;
        include /etc/nginx/snippets/team36-proxy.conf;
    }
}


